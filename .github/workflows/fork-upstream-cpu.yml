name: Fork upstream CPU regression

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/fork-upstream-cpu.yml'
      - 'lib/model/**'
      - 'plugins/train/model/**'
      - 'requirements/**'
      - 'tests/lib/model/**'
  push:
    branches: [sync/upstream-master-2026-11-12]
    paths:
      - '.github/workflows/fork-upstream-cpu.yml'
      - 'lib/model/**'
      - 'plugins/train/model/**'
      - 'requirements/**'
      - 'tests/lib/model/**'

permissions:
  contents: read

concurrency:
  group: fork-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FACESWAP_BACKEND: cpu
      KERAS_BACKEND: torch
      KERAS_TORCH_DEVICE: cpu
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install project CPU requirements and test runner
        run: python -m pip install -r requirements/requirements_cpu.txt pytest
      - name: Validate custom layers and upstream regressions on CPU
        run: python -m pytest -v tests/lib/model/layers_test.py tests/lib/model/upstream_sync_test.py
